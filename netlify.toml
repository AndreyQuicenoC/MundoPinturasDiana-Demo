# Next.js App Router + Payload (servidor Node)
[build]
  command = "npm run build:hosted"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

